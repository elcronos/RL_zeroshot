[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rogue-laya-rl"
version = "0.1.0"
description = "Frozen Laya residual-policy experiments in mGBA Emerald Rogue battles"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<12", "torch>=2.5,<3"]

[project.optional-dependencies]
laya = ["laya-coreml==0.1.0"]
prism = ["transformers>=4.48,<6", "sentencepiece>=0.2,<1"]
test = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
rogue-rl = "rogue_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
